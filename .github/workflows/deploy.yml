name: Deploy ToSeguroApp to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            # 1. Limpar ambiente antigo
            rm -rf ToSeguroApp
            
            # 2. Clonar o repositório atualizado
            git clone https://github.com/TrogistDev/ToSeguroApp.git ToSeguroApp
            
            # 3. Entrar na pasta do Docker Compose
            cd ToSeguroApp/apps

            # 4. Executar os comandos usando o caminho real do binário do sistema (/bin/docker)
            sudo -E /bin/docker compose down --remove-orphans
            sudo -E /bin/docker compose up --build -d