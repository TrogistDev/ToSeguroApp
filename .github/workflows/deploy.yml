name: Deploy ToSeguroApp to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            # 1. Garantir que estamos na pasta certa ou clonar
            if [ ! -d "ToSeguroApp" ]; then
              git clone https://github.com/TrogistDev/ToSeguroApp ToSeguroApp
              cd ToSeguroApp/apps
            else
              cd ToSeguroApp
              git fetch --all
              git reset --hard origin/main
              cd apps
            fi

            # 2. Executar chamando o binário direto do Docker pelo caminho absoluto do sistema
            /usr/bin/docker compose down --remove-orphans
            /usr/bin/docker compose up --build -d