name: Deploy ToSeguroApp to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/ToSeguroApp
            git reset --hard
            git pull origin main
            cd apps

            # 1. Higieniza e define variáveis de ambiente sem quebras de linha fantasmas
            DB_USER=$(echo "${{ secrets.DB_USER }}" | tr -d '\r\n')
            DB_PASSWORD=$(echo "${{ secrets.DB_PASSWORD }}" | tr -d '\r\n')
            DB_NAME=$(echo "${{ secrets.DB_NAME }}" | tr -d '\r\n')
            CLEAN_GOOGLE_ID=$(echo "${{ secrets.GOOGLE_CLIENT_ID }}" | tr -d '\r\n')

            [ -z "$DB_USER" ] && DB_USER="postgres"
            [ -z "$DB_PASSWORD" ] && DB_PASSWORD="password_secure"
            [ -z "$DB_NAME" ] && DB_NAME="toseguro_db"

            # Gera o arquivo .env limpando as quebras ocultas
            echo "NODE_ENV=$(echo "${{ secrets.NODE_ENV }}" | tr -d '\r\n')" > .env
            echo "PORT=$(echo "${{ secrets.PORT }}" | tr -d '\r\n')" >> .env
            echo "JWT_SECRET=$(echo "${{ secrets.JWT_SECRET }}" | tr -d '\r\n')" >> .env
            echo "AWS_ACCESS_KEY_ID=$(echo "${{ secrets.AWS_ACCESS_KEY_ID }}" | tr -d '\r\n')" >> .env
            echo "AWS_SECRET_ACCESS_KEY=$(echo "${{ secrets.AWS_SECRET_ACCESS_KEY }}" | tr -d '\r\n')" >> .env
            echo "AWS_REGION=$(echo "${{ secrets.AWS_REGION }}" | tr -d '\r\n')" >> .env
            echo "AWS_BUCKET_NAME=$(echo "${{ secrets.AWS_BUCKET_NAME }}" | tr -d '\r\n')" >> .env
            echo "EMAIL_HOST=$(echo "${{ secrets.EMAIL_HOST }}" | tr -d '\r\n')" >> .env
            echo "EMAIL_PORT=$(echo "${{ secrets.EMAIL_PORT }}" | tr -d '\r\n')" >> .env
            echo "EMAIL_USER=$(echo "${{ secrets.EMAIL_USER }}" | tr -d '\r\n')" >> .env
            echo "EMAIL_PASS=$(echo "${{ secrets.EMAIL_PASS }}" | tr -d '\r\n')" >> .env
            echo "EMAIL_FROM=$(echo "${{ secrets.EMAIL_FROM }}" | tr -d '\r\n')" >> .env
            echo "GOOGLE_CLIENT_SECRET=$(echo "${{ secrets.GOOGLE_CLIENT_SECRET }}" | tr -d '\r\n')" >> .env
            echo "GOOGLE_CLIENT_ID=$CLEAN_GOOGLE_ID" >> .env

            echo "DB_USER=$DB_USER" >> .env
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env
            echo "DB_NAME=$DB_NAME" >> .env

            echo "DATABASE_URL=postgresql://$DB_USER:$DB_PASSWORD@postgres:5432/$DB_NAME?schema=public" >> .env
            
            # Injeção de variáveis tratadas para o Frontend
            echo "VITE_GOOGLE_CLIENT_ID=$CLEAN_GOOGLE_ID" >> .env
            echo "VITE_API_URL=http://$(echo "${{ secrets.AWS_HOST }}" | tr -d '\r\n'):3000/api" >> .env

            export VITE_GOOGLE_CLIENT_ID="$CLEAN_GOOGLE_ID"
            export VITE_API_URL="http://$(echo "${{ secrets.AWS_HOST }}" | tr -d '\r\n'):3000/api"

            # 3. Build do frontend passando os argumentos higienizados
            docker-compose build --no-cache \
              --build-arg VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
              --build-arg VITE_API_URL="$VITE_API_URL" \
              app

            # 4. Limpa volumes e levanta a stack sem erros de sintaxe
            docker-compose down -v
            docker-compose up -d --remove-orphans