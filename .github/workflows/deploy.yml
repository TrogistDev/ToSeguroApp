name: Deploy ToSeguroApp to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            # 1. Garantir que o Docker Compose está instalado na máquina virtual (Abordagem Rígida)
            if ! command -v docker-compose &> /dev/null; then
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.26.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose || true
            fi

            # 2. Limpar ambiente antigo
            rm -rf ToSeguroApp
            
            # 3. Clonar o repositório de forma limpa
            git clone https://github.com/TrogistDev/ToSeguroApp.git ToSeguroApp
            
            # 4. Entrar na pasta correta da arquitetura
            cd ToSeguroApp/apps

            # 5. Orquestrar os containers com o binário garantido
            docker-compose down || true
            docker-compose up --build -d