name: Deploy ToSeguroApp to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script_stop: true
          script: |
            # 1. Navegar direto para a pasta do projeto que JÁ EXISTE na máquina
            cd /home/ubuntu/ToSeguroApp

            # 2. Atualizar o código de forma rígida com o que foi commitado
            git reset --hard
            git pull origin main

            # 3. Mudar para o diretório da infraestrutura
            cd apps

            # 4. Atualizar as variáveis de ambiente a partir das Secrets do GitHub
            echo "${{ secrets.PROD_ENV_FILE }}" > .env

            # 5. Orquestrar os containers com Zero Downtime
            docker-compose up --build -d --remove-orphans