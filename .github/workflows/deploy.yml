name: Deploy ToSeguroApp to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Garantir que estamos na pasta certa ou clonar
            if [ ! -d "ToSeguroApp" ]; then
              git clone https://github.com/${{ github.repository }} ToSeguroApp
              cd ToSeguroApp/apps
            else
              cd ToSeguroApp
              git fetch --all
              git reset --hard origin/main
              cd apps
            fi

            # 2. Comando único de deploy na AWS
            docker compose down
            docker compose up --build -d