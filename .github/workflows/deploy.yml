name: Deploy ToSeguroApp to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            # 1. Limpar ambiente antigo
            rm -rf ToSeguroApp
            
            # 2. Clonar o repositório de forma limpa
            git clone https://github.com/TrogistDev/ToSeguroApp.git ToSeguroApp
            
            # 3. Entrar na pasta correta da arquitetura
            cd ToSeguroApp/apps

            # 4. Parar serviços antigos usando a sintaxe clássica do pacote instalado
            docker-compose down || true
            
            # 5. Buildar e subir os containers (Postgres, Redis, Frontend)
            docker-compose up --build -d