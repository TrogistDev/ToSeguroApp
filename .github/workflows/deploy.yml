name: Deploy ToSeguroApp to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            # 1. Garantir um ambiente 100% limpo na nuvem
            sudo rm -rf ToSeguroApp
            
            # 2. Clonar o repositório atualizado de forma limpa
            git clone https://github.com/TrogistDev/ToSeguroApp.git ToSeguroApp
            
            # 3. Entrar na pasta onde está o Docker Compose
            cd ToSeguroApp/apps

            # 4. Executar o deploy chamando o caminho absoluto do binário via sudo
            sudo /usr/bin/docker compose down --remove-orphans
            sudo /usr/bin/docker compose up --build -d