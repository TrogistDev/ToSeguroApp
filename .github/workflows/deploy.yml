name: Deploy ToSeguroApp to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/ToSeguroApp
            git reset --hard
            git pull origin main
            cd apps

            # 1. Definição explícita de variáveis para sincronizar API e Banco de Dados
            # Se tiveres estes secrets no GitHub, ele usa. Se não, usa o fallback idêntico ao docker-compose.
            DB_USER="${{ secrets.DB_USER }}"
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            DB_NAME="${{ secrets.DB_NAME }}"

            [ -z "$DB_USER" ] && DB_USER="user_admin"
            [ -z "$DB_PASSWORD" ] && DB_PASSWORD="password_secure"
            [ -z "$DB_NAME" ] && DB_NAME="accident_report_db"

            # Gera o arquivo .env em runtime na VPS
            echo "NODE_ENV=${{ secrets.NODE_ENV }}" > .env
            echo "PORT=${{ secrets.PORT }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
            echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
            echo "AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}" >> .env
            echo "EMAIL_HOST=${{ secrets.EMAIL_HOST }}" >> .env
            echo "EMAIL_PORT=${{ secrets.EMAIL_PORT }}" >> .env
            echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> .env
            echo "EMAIL_PASS=${{ secrets.EMAIL_PASS }}" >> .env
            echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env

            # Força as variáveis que o docker-compose vai ler para o bloco 'postgres:'
            echo "DB_USER=$DB_USER" >> .env
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env
            echo "DB_NAME=$DB_NAME" >> .env

            # ✅ CORREÇÃO DA URL: Monta a URL dinamicamente apontando para o host 'postgres' (Rede Docker) com as credenciais certas
            echo "DATABASE_URL=postgresql://$DB_USER:$DB_PASSWORD@postgres:5432/$DB_NAME?schema=public" >> .env
            
            # Injeção de build do Frontend
            echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "VITE_API_URL=http://${{ secrets.AWS_HOST }}:3000/api" >> .env

            export VITE_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            export VITE_API_URL="http://${{ secrets.AWS_HOST }}:3000/api"

            # 3. Build do frontend
            docker-compose build --no-cache \
              --build-arg VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
              --build-arg VITE_API_URL="$VITE_API_URL" \
              app

            # 4. Limpa volumes antigos e levanta com a nova configuração de credenciais unificada
            docker-compose down -v
            docker-compose up -d --remove-orphans