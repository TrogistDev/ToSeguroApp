name: Deploy ToSeguroApp to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script_stop: true
          script: |
            # 1. Navegar direto para a pasta do projeto que JÁ EXISTE na máquina
            cd /home/ubuntu/ToSeguroApp

            # 2. Atualizar o código de forma rígida com o que foi commitado
            git reset --hard
            git pull origin main

            # 3. Mudar para o diretório da infraestrutura
            cd apps

            # 4. Limpar e recriar o arquivo .env injetando as Secrets exatas do teu GitHub
            echo "NODE_ENV=${{ secrets.NODE_ENV }}" > .env
            echo "PORT=${{ secrets.PORT }}" >> .env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            
            # Variáveis AWS mapeadas do teu print
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
            echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
            echo "AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}" >> .env
            
            # Mapeamento do serviço de email do teu print
            echo "EMAIL_HOST=${{ secrets.EMAIL_HOST }}" >> .env
            echo "EMAIL_PORT=${{ secrets.EMAIL_PORT }}" >> .env
            echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> .env
            echo "EMAIL_PASS=${{ secrets.EMAIL_PASS }}" >> .env
            echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> .env

            # Variáveis do Google do teu print
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            
            # 👇 O Vite exige o prefixo VITE_ para compilar, mas lê o teu segredo GOOGLE_CLIENT_ID
            echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            
            # 👇 Define a URL da API para o teu frontend apontar na VPS
            echo "VITE_API_URL=http://${{ secrets.AWS_HOST }}:3000" >> .env

            # 5. O segredo está aqui: exportar as variáveis ANTES do comando build
            # O docker-compose só vê o que estiver exportado no shell do servidor
            export VITE_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            export VITE_API_URL="http://ec2-13-60-56-153.eu-north-1.compute.amazonaws.com:3000"

            # Agora sim, faz o build forçando a leitura dessas variáveis
            docker-compose --env-file .env build --no-cache app
            docker-compose up -d --remove-orphans