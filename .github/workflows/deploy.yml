name: Deploy ToSeguroApp to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}       # <-- Garanta que este segredo existe com o IP 13.60.56.153
          username: ${{ secrets.AWS_USER }}   # <-- Geralmente 'ubuntu'
          key: ${{ secrets.AWS_SSH_KEY }}    # <-- O conteúdo do teu arquivo .pem
          script_stop: true
          script: |
            # 1. Garantir que o Docker Compose está instalado na máquina virtual
            if ! command -v docker-compose &> /dev/null; then
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.26.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose || true
            fi

            # 2. Parar os containers antes de apagar a pasta
            if [ -d "ToSeguroApp/apps" ]; then
              cd ToSeguroApp/apps
              docker-compose down || true
              cd ../..
            fi

            # 3. Limpeza profunda
            sudo rm -rf ToSeguroApp
            sync

            # 4. Clone e Orquestração
            git clone https://github.com/TrogistDev/ToSeguroApp.git ToSeguroApp
            cd ToSeguroApp/apps
            docker-compose up --build -d