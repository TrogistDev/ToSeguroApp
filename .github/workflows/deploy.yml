name: Deploy ToSeguroApp to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script_stop: true # Para a execução imediatamente se algum comando falhar
          script: |
            # Forçar o carregamento do perfil do sistema para reconhecer o Docker
            . ~/.bashrc
            
            # 1. Garantir que estamos na pasta certa ou clonar
            if [ ! -d "ToSeguroApp" ]; then
              git clone https://github.com/TrogistDev/ToSeguroApp ToSeguroApp
              cd ToSeguroApp/apps
            else
              cd ToSeguroApp
              git fetch --all
              git reset --hard origin/main
              cd apps
            fi

            # 2. Comando único de deploy usando sudo para evitar falhas de contexto de sessão
            sudo docker compose down --remove-orphans
            sudo docker compose up --build -d