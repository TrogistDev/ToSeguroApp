name: Deploy ToSeguroApp to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script_stop: true
          script: |
            # 1. Se a pasta não existir, faz o clone inicial; se existir, atualiza de forma limpa
            if [ ! -d "ToSeguroApp" ]; then
              git clone https://github.com/TrogistDev/ToSeguroApp.git ToSeguroApp
              cd ToSeguroApp/apps
            else
              cd ToSeguroApp
              git reset --hard
              git pull origin main
              cd apps
            fi

            # 2. Injeta o .env de produção atualizado
            echo "${{ secrets.PROD_ENV_FILE }}" > .env

            # 3. Build e Atualização Automática sem quebrar o site (Zero Downtime)
            docker-compose up --build -d --remove-orphans