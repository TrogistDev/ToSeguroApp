version: '3.8'

services:
  app:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_API_URL: ${VITE_API_URL}
    container_name: accident_frontend
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      - api
      - postgres
      - redis
    networks:
      - toseguro-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: accident_backend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Removido o DATABASE_URL daqui para ele ler obrigatoriamente do .env limpo
    depends_on:
      - postgres
      - redis
    networks:
      - toseguro-network

  postgres:
    image: postgres:16-alpine
    container_name: accident_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - toseguro-network

  redis:
    image: redis:alpine
    container_name: accident_cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - toseguro-network

networks:
  toseguro-network:
    driver: bridge

volumes:
  postgres_data: