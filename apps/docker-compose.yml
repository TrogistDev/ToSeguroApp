services:
  app:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: accident_frontend
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - api
      - postgres
      - redis

  api:
    build:
      context: ./apps/api # <-- Garanta que aponta para a pasta correta da sua API
      dockerfile: Dockerfile
    container_name: accident_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-user_admin}:${DB_PASSWORD:-password_secure}@postgres:5432/${DB_NAME:-accident_report_db}?schema=public
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: accident_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password_secure}
      POSTGRES_DB: ${DB_NAME:-accident_report_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: accident_cache
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: